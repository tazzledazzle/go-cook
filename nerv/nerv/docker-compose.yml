services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nerv
      POSTGRES_USER: nerv
      POSTGRES_PASSWORD: nerv
    ports:
      - "5433:5432"
    volumes:
      - nerv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerv -d nerv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nerv-postgres-data: